<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Categories | TheaterAdmin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="css/site.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                TheaterAdmin
            </a>

            <div class="navbar-nav">
                <a
                    class="nav-link active"
                    href="categories.html">
                    Categories
                </a>

                <a class="nav-link" href="movies.html">
                    Movies
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="page-header mb-4">
            <h1 class="h2 mb-1">Category Management</h1>

            <p class="text-secondary mb-0">
                Create, update and delete movie categories.
            </p>
        </div>

        <div id="categoryAlert"></div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm form-card">
                    <div class="card-header bg-primary text-white">
                        <h2 id="categoryFormTitle" class="h5 mb-0">
                            Create Category
                        </h2>
                    </div>

                    <div class="card-body">
                        <form id="categoryForm">
                            <input
                                type="hidden"
                                id="categoryId">

                            <div class="mb-3">
                                <label
                                    for="categoryName"
                                    class="form-label required-label">
                                    Category name
                                </label>

                                <input
                                    type="text"
                                    id="categoryName"
                                    class="form-control"
                                    minlength="2"
                                    maxlength="50"
                                    required>

                                <div class="invalid-feedback">
                                    Enter a category name.
                                </div>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="categoryCode"
                                    class="form-label required-label">
                                    Category code
                                </label>

                                <input
                                    type="text"
                                    id="categoryCode"
                                    class="form-control text-uppercase"
                                    maxlength="10"
                                    required>

                                <div class="invalid-feedback">
                                    Enter a category code.
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button
                                    type="submit"
                                    class="btn btn-primary">
                                    Save Category
                                </button>

                                <button
                                    type="button"
                                    id="cancelCategoryEdit"
                                    class="btn btn-outline-secondary d-none">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div
                        class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">Categories</h2>

                        <button
                            id="refreshCategories"
                            class="btn btn-sm btn-outline-primary">
                            Refresh
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Code</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody id="categoryTableBody">
                                <tr>
                                    <td
                                        colspan="4"
                                        class="text-center py-4">
                                        Loading categories...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/config.js"></script>
    <script src="js/categories.js"></script>
</body>
</html>
