<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Movies | TheaterAdmin</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link href="css/site.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                TheaterAdmin
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="categories.html">
                    Categories
                </a>

                <a class="nav-link active" href="movies.html">
                    Movies
                </a>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-lg-5 py-4">
        <div class="page-header mb-4">
            <h1 class="h2 mb-1">Movie Management</h1>

            <p class="text-secondary mb-0">
                Create, update and delete theatre movies.
            </p>
        </div>

        <div id="movieAlert"></div>

        <div class="row g-4">
            <div class="col-xl-4">
                <div class="card shadow-sm form-card">
                    <div class="card-header bg-success text-white">
                        <h2 id="movieFormTitle" class="h5 mb-0">
                            Create Movie
                        </h2>
                    </div>

                    <div class="card-body">
                        <form id="movieForm">
                            <input type="hidden" id="movieId">

                            <div class="mb-3">
                                <label
                                    for="movieName"
                                    class="form-label required-label">
                                    Movie name
                                </label>

                                <input
                                    type="text"
                                    id="movieName"
                                    class="form-control"
                                    minlength="2"
                                    maxlength="100"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="director"
                                    class="form-label required-label">
                                    Director
                                </label>

                                <input
                                    type="text"
                                    id="director"
                                    class="form-control"
                                    maxlength="50"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="email"
                                    class="form-label required-label">
                                    Contact email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="releaseDate"
                                    class="form-label required-label">
                                    Release date
                                </label>

                                <input
                                    type="date"
                                    id="releaseDate"
                                    class="form-control"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="language"
                                    class="form-label required-label">
                                    Language
                                </label>

                                <select
                                    id="language"
                                    class="form-select"
                                    required>
                                    <option value="">
                                        Select language
                                    </option>

                                    <option value="English">English</option>
                                    <option value="Japanese">Japanese</option>
                                    <option value="Chinese">Chinese</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label
                                    for="categoryId"
                                    class="form-label required-label">
                                    Category
                                </label>

                                <select
                                    id="categoryId"
                                    class="form-select"
                                    required>
                                    <option value="">
                                        Loading categories...
                                    </option>
                                </select>
                            </div>

                            <div class="d-flex gap-2">
                                <button
                                    type="submit"
                                    class="btn btn-success">
                                    Save Movie
                                </button>

                                <button
                                    type="button"
                                    id="cancelMovieEdit"
                                    class="btn btn-outline-secondary d-none">
                                    Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-xl-8">
                <div class="card shadow-sm">
                    <div
                        class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">Movies</h2>

                        <button
                            id="refreshMovies"
                            class="btn btn-sm btn-outline-success">
                            Refresh
                        </button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Name</th>
                                    <th>Director</th>
                                    <th>Release date</th>
                                    <th>Language</th>
                                    <th>Category</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody id="movieTableBody">
                                <tr>
                                    <td
                                        colspan="6"
                                        class="text-center py-4">
                                        Loading movies...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/config.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
