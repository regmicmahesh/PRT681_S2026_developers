<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theater Admin — Movies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Movies</h1>
    <div>
      <a href="categories.html" class="btn btn-outline-secondary">Categories</a>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#movieModal" onclick="openCreateMovie()">+ New Movie</button>
    </div>
  </div>

  <div id="movieAlert" class="alert alert-danger d-none"></div>

  <table class="table table-bordered bg-white">
    <thead>
      <tr>
        <th>Id</th><th>Name</th><th>Release Date</th><th>Director</th>
        <th>Email</th><th>Language</th><th>Category</th><th></th>
      </tr>
    </thead>
    <tbody id="movieTableBody"></tbody>
  </table>
</div>

<!-- Create/Edit modal -->
<div class="modal fade" id="movieModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="movieForm">
        <div class="modal-header">
          <h5 class="modal-title" id="movieModalTitle">New Movie</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="movieId">

          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="movieName" required maxlength="200">
          </div>

          <div class="mb-3">
            <label class="form-label">Release Date</label>
            <input type="date" class="form-control" id="movieReleaseDate" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Director</label>
            <input type="text" class="form-control" id="movieDirector" required maxlength="150">
          </div>

          <div class="mb-3">
            <label class="form-label">Contact Email</label>
            <input type="email" class="form-control" id="movieEmail" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Language</label>
            <select class="form-select" id="movieLanguage" required>
              <option value="English">English</option>
              <option value="Japanese">Japanese</option>
              <option value="Chinese">Chinese</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" id="movieCategoryId" required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/movies.js"></script>
</body>
</html>
