<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Theater Admin — Categories</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Categories</h1>
    <div>
      <a href="index.html" class="btn btn-outline-secondary">Movies</a>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal" onclick="openCreateCategory()">+ New Category</button>
    </div>
  </div>

  <div id="categoryAlert" class="alert alert-danger d-none"></div>

  <table class="table table-bordered bg-white">
    <thead><tr><th>Id</th><th>Name</th><th>Code</th><th></th></tr></thead>
    <tbody id="categoryTableBody"></tbody>
  </table>
</div>

<!-- Create/Edit modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="categoryForm">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryModalTitle">New Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="categoryId">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" id="categoryName" required maxlength="100">
          </div>
          <div class="mb-3">
            <label class="form-label">Code</label>
            <input type="text" class="form-control" id="categoryCode" required maxlength="10">
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
